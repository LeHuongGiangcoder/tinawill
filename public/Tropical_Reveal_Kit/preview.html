<script>
const config = JSON.parse(document.getElementById('config').textContent);
const {canvas, assets, groups, camera, bird, fruitDrop, leafParticles, finalFocus, duration} = config;
const stage = document.getElementById('stage');
const view = document.getElementById('view');
const ctx = view.getContext('2d', {alpha:true});
const play = document.getElementById('play');
const replay = document.getElementById('replay');
const scrub = document.getElementById('scrub');
const time = document.getElementById('time');
const status = document.getElementById('status');
const rows = Object.fromEntries(assets.map(row => [row.id,row]));
const stack = assets.filter(row => Number.isFinite(row.z)).sort((a,b) => a.z-b.z);
const center = [canvas.width/2,canvas.height/2];
const clamp = v => Math.max(0,Math.min(1,v));
const lerp = (a,b,t) => a+(b-a)*t;
const smooth = t => t*t*(3-2*t);
const progress = (t,a,b) => clamp((t-a)/(b-a));
const radians = a => a*Math.PI/180;
const turn = (x,y,a) => [x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)];
view.width = canvas.width;
view.height = canvas.height;
scrub.max = duration;

function interpolate(keys,t) {
  if(t<=keys[0][0]) return keys[0].slice(1);
  for(let i=1;i<keys.length;i++) {
    if(t<=keys[i][0]) {
      const a=keys[i-1],b=keys[i],u=smooth(progress(t,a[0],b[0]));
      return b.slice(1).map((value,j)=>lerp(a[j+1],value,u));
    }
  }
  return keys.at(-1).slice(1);
}

// Interpolate flight positions with a continuous velocity through the keys.
function flightAt(t) {
  const keys=bird.flightKeys;
  let i=1;
  while(i<keys.length-1 && t>keys[i][0]) i++;
  const a=keys[i-1],b=keys[i],p=keys[Math.max(0,i-2)],n=keys[Math.min(keys.length-1,i+1)];
  const d=b[0]-a[0],u=progress(t,a[0],b[0]),u2=u*u,u3=u2*u;
  return a.slice(1).map((value,j)=>{
    const k=j+1, m0=i===1?0:(b[k]-p[k])/(b[0]-p[0])*d;
    const m1=(n[k]-a[k])/(n[0]-a[0])*d;
    return (2*u3-3*u2+1)*value+(u3-2*u2+u)*m0+(-2*u3+3*u2)*b[k]+(u3-u2)*m1;
  });
}

function worldCamera(t) {
  const u=clamp(t/duration), ease=smooth(u);
  const s=lerp(ease,u,camera.linearWeight);
  return {
    zoom:lerp(camera.startZoom,camera.endZoom,s),
    aim:camera.startAim.map((v,i)=>lerp(v,camera.endAim[i],ease))
  };
}

function useCamera(state,depth) {
  const scale=1+(state.zoom-1)*depth;
  ctx.translate(center[0],center[1]);
  ctx.scale(scale,scale);
  ctx.translate(-state.aim[0],-state.aim[1]);
}

function groupAt(group,t) {
  const phase=progress(t,group.start,group.end);
  const u=smooth(phase**(group.easePower??1));
  return [group.delta[0]*u,group.delta[1]*u+group.arcY*Math.sin(Math.PI*u),radians(group.rotationDeg*u)];
}

function useGroup(group,t) {
  const [x,y,a]=groupAt(group,t);
  ctx.translate(group.pivot[0]+x,group.pivot[1]+y);
  ctx.rotate(a);
  ctx.translate(-group.pivot[0],-group.pivot[1]);
}

function origin(row) {
  const offset=row.sourceOffset??[0,0];
  return [row.rect[0]+offset[0],row.rect[1]+offset[1]];
}

function draw(row) {
  ctx.drawImage(row.image,...origin(row));
}

function useSpritePivot(row) {
  const [x,y]=origin(row);
  ctx.translate(x+row.pivot[0],y+row.pivot[1]);
}

function drawWing(id,t) {
  const open=smooth(progress(t,bird.wingsStart,bird.wingsOpen));
  if(open<=0) return;
  const phase=((t-bird.wingsStart)/bird.wingPeriod+(id==='wing_far'?0.15:0))%1;
  const [angle,spread]=interpolate(bird.wingCycle,phase);
  const row=rows[id], near=id==='wing_near';
  ctx.save();
  ctx.translate(...bird.shoulders[id]);
  ctx.globalAlpha=(near?1:0.86)*smooth(progress(open,0.04,0.48));
  ctx.rotate(radians(near?angle:-(angle*0.68)+11));
  const width=lerp(0.19,spread*(near?0.97:0.75),open);
  const height=lerp(0.18,spread*(near?0.92:0.67),open);
  ctx.scale(near?width:-width,height);
  ctx.drawImage(row.image,-row.pivot[0],-row.pivot[1]);
  ctx.restore();
}

function drawBirdPart(row,t) {
  const airborne=t>=bird.launchAt;
  if(t>=bird.flightEnd) return;
  const [crouch,preTilt]=interpolate(bird.anticipation,t);
  const [x,y,tilt]=airborne?flightAt(t):[0,crouch,preTilt];
  const [px,py]=bird.bodyPivot;
  const release=1-smooth(progress(t,bird.launchAt,bird.launchAt+0.17));
  ctx.translate(px+x,py+y+(airborne?crouch*release:0));
  ctx.rotate(radians(tilt));
  ctx.translate(-px,-py);
  if(row.id==='parrot_body') {
    drawWing('wing_far',t);
    if(airborne) {
      ctx.globalAlpha=smooth(progress(t,bird.launchAt,bird.launchAt+0.12));
      draw(rows.parrot_tail_fill);
      ctx.globalAlpha=1;
    }
    draw(t<=0.25?row:rows.parrot_body_motion);
    drawWing('wing_near',t);
  } else {
    const [angle,width,slide]=interpolate(bird.headKeys,t);
    useSpritePivot(row);
    ctx.translate(slide,0);
    ctx.rotate(radians(angle));
    ctx.scale(width,1);
    ctx.drawImage(row.image,-row.pivot[0],-row.pivot[1]);
  }
}

function attachedPivot(row,group,t) {
  const [x,y]=origin(row);
  const [dx,dy,a]=groupAt(group,t);
  const [gx,gy]=group.pivot;
  const [rx,ry]=turn(x+row.pivot[0]-gx,y+row.pivot[1]-gy,a);
  return [gx+dx+rx,gy+dy+ry,a];
}

function drawFruit(row,group,t) {
  const dt=t-fruitDrop.at;
  if(dt>fruitDrop.duration) return;
  const [x,y,angle]=attachedPivot(row,group,fruitDrop.at);
  const h=0.004;
  const [ax,ay]=attachedPivot(row,group,fruitDrop.at-h);
  // Ease in the extra pull over the first 90ms, retaining the inherited velocity.
  const impulse=dt-0.09*(1-Math.exp(-dt/0.09));
  const dx=((x-ax)/h)*dt+fruitDrop.releaseVelocity[0]*impulse+0.5*fruitDrop.dragX*dt*dt;
  const dy=((y-ay)/h)*dt+fruitDrop.releaseVelocity[1]*impulse+0.5*fruitDrop.gravity*dt*dt;
  ctx.translate(x+dx,y+dy);
  ctx.rotate(angle+radians(fruitDrop.spinDegPerSecond*impulse));
  ctx.drawImage(row.image,-row.pivot[0],-row.pivot[1]);
}

function drawLeaf(fx,t,cameraState) {
  const dt=t-fx.at;
  if(dt<0||dt>fx.duration) return;
  const u=dt/fx.duration;
  const wave=Math.sin(dt*6.5+fx.phase)-Math.sin(fx.phase);
  const row=rows[fx.asset];
  ctx.save();
  useCamera(cameraState,fx.depth);
  ctx.translate(fx.origin[0]+fx.drift*u+wave*fx.flutter,fx.origin[1]+fx.fall*(0.28*u+0.72*u*u));
  ctx.rotate(fx.spin*dt+0.44*wave);
  const roll=0.34+0.66*Math.abs(Math.cos(4.2*dt+fx.phase));
  ctx.scale(fx.scale*roll,fx.scale);
  ctx.globalAlpha=smooth(progress(dt,0,0.17))*(1-smooth(progress(u,0.85,1)));
  ctx.drawImage(row.image,-row.pivot[0],-row.pivot[1]);
  ctx.restore();
}

let focusImage=null;
function drawFinalFocus(t,state) {
  if(!focusImage||t<=finalFocus.visibility.start) return;
  const {width,height}=focusImage;
  const scale=Math.min(1,finalFocus.maxSize[0]/width,finalFocus.maxSize[1]/height);
  const w=width*scale,h=height*scale;
  ctx.save();
  useCamera(state,finalFocus.depth);
  ctx.globalAlpha=smooth(progress(t,finalFocus.visibility.start,finalFocus.visibility.end));
  ctx.drawImage(focusImage,finalFocus.center[0]-w/2,finalFocus.center[1]-h/2,w,h);
  ctx.restore();
}

function render(t) {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const state=worldCamera(t);
  drawFinalFocus(t,state);
  for(const row of stack) {
    const group=groups[row.group];
    ctx.save();
    useCamera(state,group.depth);
    if(row.group==='bird') {
      drawBirdPart(row,t);
    } else if(row.id===fruitDrop.asset && t>=fruitDrop.at) {
      drawFruit(row,group,t);
    } else {
      useGroup(group,t);
      if(row.id==='branch_perch'&&t>bird.perchPatchIn[0]) {
        ctx.globalAlpha=smooth(progress(t,...bird.perchPatchIn));
        draw(rows.perch_under_foot);
        ctx.globalAlpha=1;
      }
      draw(row);
    }
    ctx.restore();
  }
  for(const fx of leafParticles) drawLeaf(fx,t,state);
  scrub.value=t;
  time.value=t.toFixed(2)+' s';
}

let position=0, start=0, frame=0, playing=false;
function pause() {
  cancelAnimationFrame(frame);
  playing=false;
  play.textContent='Phát';
}
function tick(now) {
  position=Math.min(duration,(now-start)/1000);
  render(position);
  if(position<duration) frame=requestAnimationFrame(tick);
  else pause();
}
function run() {
  if(position>=duration) position=0;
  start=performance.now()-position*1000;
  playing=true;
  play.textContent='Tạm dừng';
  frame=requestAnimationFrame(tick);
}
play.addEventListener('click',()=>playing?pause():run());
replay.addEventListener('click',()=>{pause();position=0;render(0);run();});
scrub.addEventListener('input',()=>{pause();position=Number(scrub.value);render(position);});
document.getElementById('alpha').addEventListener('change',e=>stage.classList.toggle('checker',e.target.checked));
document.getElementById('zone').addEventListener('change',e=>document.getElementById('focus').hidden=!e.target.checked);

async function loadSprite(path) {
  const image=new Image();
  image.src=path;
  await image.decode();
  return image;
}
const preload=assets.map(async row=>{row.image=await loadSprite(row.file);});
if(finalFocus.asset) preload.push(loadSprite(finalFocus.asset).then(image=>{focusImage=image;}));
Promise.all(preload).then(()=>{
  render(0);
  play.disabled=replay.disabled=scrub.disabled=false;
  status.textContent='8.4 giây';
}).catch(error=>{
  console.error(error);
  status.textContent='Hãy giải nén toàn bộ thư mục trước khi mở.';
});
</script>
</html>
